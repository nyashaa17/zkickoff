[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Configures Next.js to omit heavy trace files when not needed or optimize for Netlify functions
  NEXT_DISABLE_SOURCEMAPS = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/livescore"
  to = "/.netlify/functions/livescore"
  status = 200

[[redirects]]
  from = "/api/standings"
  to = "/.netlify/functions/standings"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/match-buttons/:matchId"
  to = "/.netlify/functions/match-buttons?matchId=:matchId"
  status = 200

[[redirects]]
  from = "/api/commentary/:matchId"
  to = "/.netlify/functions/commentary?matchId=:matchId"
  status = 200
